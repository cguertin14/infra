apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-postgres
  namespace: monitoring
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  instances: 1

  # Work around AppArmor signal denials after the 7.0.0-42 kernel update.
  # Preserve CNPG defaults because podSecurityContext overrides them.
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
    fsGroup: 26
    seccompProfile:
      type: RuntimeDefault
    appArmorProfile:
      type: Unconfined

  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-postgres-credentials

  storage:
    size: 10Gi
    storageClass: ceph-block

  resources:
    limits:
      memory: 250Mi
    requests:
      cpu: 100m
      memory: 250Mi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
