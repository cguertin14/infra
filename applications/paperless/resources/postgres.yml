apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  instances: 1

  # Work around AppArmor signal denials after the 7.0.0-42 kernel update.
  # Preserve CNPG defaults because podSecurityContext overrides them.
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
    fsGroup: 26
    seccompProfile:
      type: RuntimeDefault
    appArmorProfile:
      type: Unconfined
  
  # Not needed, for now
  # postgresql:

  bootstrap:
    initdb:
      database: paperless-db
      owner: paperless-user
      secret:
        name: paperless-postgres-creds
  # Storage
  storage:
    size: 10Gi
    storageClass: ceph-block
  # Resources
  resources:
    limits:
      memory: 250Mi
    requests:
      cpu: 100m
      memory: 250Mi
  # Run on amd64 nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
