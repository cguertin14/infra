kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namespace: envoy-gateway-system

resources:
- resources/gateway.yml
- resources/wildcard-certificates.yml
- resources/educs-certificates.yml
- resources/client-traffic-policy.yml
- resources/service-monitor.yml

helmCharts:
- name: gateway-helm
  releaseName: envoy-gateway
  namespace: envoy-gateway-system
  repo: oci://docker.io/envoyproxy
  version: 1.9.2
  includeCRDs: true
  valuesInline:
    replicas: 2
    podDisruptionBudget:
      minAvailable: 1
    crds:
      # The chart ships experimental-channel Gateway API CRDs, but the bundled
      # safe-upgrades ValidatingAdmissionPolicy denies upgrading existing
      # standard-channel CRDs to experimental ones.
      gatewayAPI:
        safeUpgradePolicy:
          enabled: false
