apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-stack

replicas:
# NOTE: searxng is scaled down for now.
- name: searxng
  count: 0

resources:
- resources/searxng
- resources/ollama
- resources/open-webui
- resources/open-webui-postgres.yml
- resources/open-webui-httproute.yml
- resources/open-webui-security-policy.yml
- resources/open-webui-backend-traffic-policy.yml

generators:
- secrets-generator.yml

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/part-of: ai-stack

images:
- name: ollama/ollama
  newTag: 0.40.15
- name: ghcr.io/open-webui/open-webui
  newTag: v0.13.3
- name: searxng/searxng
  newTag: 2026.11.6-ac11e14c5
