apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: ai-stack
data:
  settings.yml: |
    use_default_settings:
      engines:
        remove:
          - google cse
          - brave
          - brave.images
          - brave.videos
          - brave.news

    general:
      instance_name: "searxng"

    search:
      safe_search: 0
      formats:
        - html
        - json

    server:
      limiter: false
      image_proxy: false
      secret_key: ""

    outgoing:
      request_timeout: 6.0
      max_request_timeout: 10.0

    engines:
      - name: duckduckgo
        disabled: false
      - name: bing
        disabled: false
      - name: mojeek
        disabled: false
      - name: startpage
        disabled: false
      - name: wikipedia
        disabled: false
      - name: github
        disabled: false
      - name: ahmia
        inactive: true
      - name: torch
        inactive: true
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector:
    app.kubernetes.io/name: searxng
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng
        imagePullPolicy: IfNotPresent
        env:
        - name: SEARXNG_BIND_ADDRESS
          value: 0.0.0.0
        - name: SEARXNG_PORT
          value: "8080"
        - name: GRANIAN_LOG_ACCESS_ENABLED
          value: "true"
        - name: GRANIAN_LOG_ACCESS_FMT
          value: '[%(time)s] %(addr)s "%(method)s %(path)s?%(query_string)s %(protocol)s" %(status)d %(dt_ms).3f'
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: secret-key
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
        volumeMounts:
        - name: settings
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
          readOnly: true
      volumes:
      - name: settings
        configMap:
          name: searxng-settings
