apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  annotations:
    velero.io/exclude-from-backup: "true"
spec:
  storageClassName: ceph-block
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_BASE_URL
          value: http://ollama:11434
        - name: DATABASE_TYPE
          value: postgresql
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: open-webui-postgres-credentials
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: open-webui-postgres-credentials
              key: password
        - name: DATABASE_HOST
          value: open-webui-postgres-rw
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: openwebui
        - name: WEBUI_URL
          value: https://chat.cguertin.dev
        - name: ENABLE_SIGNUP
          value: "false"
        # The rest of the web search settings are set in the UI.
        - name: ENABLE_WEB_SEARCH
          value: "true"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data
