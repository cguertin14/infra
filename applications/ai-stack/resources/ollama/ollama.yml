apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  annotations:
    velero.io/exclude-from-backup: "true"
spec:
  storageClassName: ceph-block
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app.kubernetes.io/name: ollama
  type: ClusterIP
  ports:
  - name: http
    port: 11434
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      runtimeClassName: nvidia
      containers:
      - name: ollama
        image: ollama/ollama
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_CONTEXT_LENGTH
          value: "2048"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        ports:
        - name: http
          containerPort: 11434
          protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 8Gi
            nvidia.com/gpu: 1 # important
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
