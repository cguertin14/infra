apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediaplatform

resources:
- resources/namespace.yml
- resources/postgres.yml
- resources/volumes.yml
- resources/httproutes.yml
- resources/jellyfin-login-rate-limit.yml
- resources/security-policy.yml
- resources/backend-traffic-policy.yml

generators:
- secrets-generator.yml

## Important: Storage logic
#
# 1. each service must have its own PVC. -> Add 'persistence' to each chart. -> DONE.
# 2. radarr and sonarr all use the same PVC as Jellyfin.
# 3. Arr application databases use dedicated CloudNativePG clusters.

helmCharts:
- name: jellyfin
  namespace: mediaplatform
  releaseName: jellyfin
  repo: https://k8s-at-home.com/charts/
  valuesInline:
    env:
      TZ: America/Toronto
      JELLYFIN_PublishedServerUrl: https://jellyfin.media.cguertin.dev
    envFrom:
    - configMapRef:
        name: mediaplatform-env
    persistence:
      config:
        enabled: true
        size: 75Gi
        storageClass: ceph-block
    # resources:
    #   # Warning: No limits.
    #   requests:
    #     cpu: '2'
    #     memory: 4Gi
  version: 9.5.3
# Below charts live here -> https://github.com/k8s-at-home/charts/tree/master/charts/stable
- name: radarr
  namespace: mediaplatform
  releaseName: radarr
  repo: https://k8s-at-home.com/charts/
  valuesInline:
    controller:
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    env:
      TZ: America/Toronto
      Radarr__Postgres__Host: radarr-postgres-rw
      Radarr__Postgres__Port: "5432"
      Radarr__Postgres__User:
        valueFrom:
          secretKeyRef:
            name: radarr-postgres-credentials
            key: username
      Radarr__Postgres__Password:
        valueFrom:
          secretKeyRef:
            name: radarr-postgres-credentials
            key: password
      Radarr__Postgres__MainDb: radarr-main
      Radarr__Postgres__LogDb: radarr-log
    envFrom:
    - configMapRef:
        name: mediaplatform-env
    probes:
      liveness:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 12
      readiness:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      startup:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 60
    persistence:
      config:
        enabled: true
        size: 2Gi
        storageClass: ceph-block
  version: 16.3.2
- name: sonarr
  namespace: mediaplatform
  releaseName: sonarr
  repo: https://k8s-at-home.com/charts/
  valuesInline:
    controller:
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    env:
      TZ: America/Toronto
      Sonarr__Postgres__Host: sonarr-postgres-rw
      Sonarr__Postgres__Port: "5432"
      Sonarr__Postgres__User:
        valueFrom:
          secretKeyRef:
            name: sonarr-postgres-credentials
            key: username
      Sonarr__Postgres__Password:
        valueFrom:
          secretKeyRef:
            name: sonarr-postgres-credentials
            key: password
      Sonarr__Postgres__MainDb: sonarr-main
      Sonarr__Postgres__LogDb: sonarr-log
    envFrom:
    - configMapRef:
        name: mediaplatform-env
    probes:
      liveness:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 12
      readiness:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      startup:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 60
    persistence:
      config:
        enabled: true
        size: 2Gi
        storageClass: ceph-block
  version: 16.3.2
- name: prowlarr
  namespace: mediaplatform
  releaseName: prowlarr
  repo: https://k8s-at-home.com/charts/
  valuesInline:
    controller:
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    env:
      TZ: America/Toronto
      Prowlarr__Postgres__Host: prowlarr-postgres-rw
      Prowlarr__Postgres__Port: "5432"
      Prowlarr__Postgres__User:
        valueFrom:
          secretKeyRef:
            name: prowlarr-postgres-credentials
            key: username
      Prowlarr__Postgres__Password:
        valueFrom:
          secretKeyRef:
            name: prowlarr-postgres-credentials
            key: password
      Prowlarr__Postgres__MainDb: prowlarr-main
      Prowlarr__Postgres__LogDb: prowlarr-log
    envFrom:
    - configMapRef:
        name: mediaplatform-env
    probes:
      liveness:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 12
      readiness:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      startup:
        enabled: true
        custom: false
        spec:
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 60
    persistence:
      config:
        enabled: true
        size: 2Gi
        storageClass: ceph-block
  version: 4.5.2
- name: sabnzbd
  namespace: mediaplatform
  releaseName: sabnzbd
  repo: https://k8s-at-home.com/charts/
  valuesInline:
    env:
      TZ: America/Toronto
    envFrom:
    - configMapRef:
        name: mediaplatform-env
    persistence:
      config:
        enabled: true
        size: 2Gi
        storageClass: ceph-block
    # resources:
    #   # Warning: No limits.
    #   requests:
    #     cpu: '0.5' # take half a core.
    #     memory: 1Gi
  version: 9.4.2

# Setting proper image tags on each service.
images:
- name: jellyfin/jellyfin
  newTag: "12.4"
- name: ghcr.io/k8s-at-home/sonarr
  newName: linuxserver/sonarr
  newTag: 4.0.20
- name: ghcr.io/k8s-at-home/radarr
  newName: linuxserver/radarr
  newTag: 7.0.3
- name: ghcr.io/k8s-at-home/prowlarr
  newName: linuxserver/prowlarr
  newTag: 2.7.0
- name: ghcr.io/k8s-at-home/sabnzbd
  newName: linuxserver/sabnzbd
  newTag: 5.1.3

# Patches to add standalone common PVC to each service.
patches:
- path: patches/radarr-apparmor-profile-patch.yml
- path: patches/sonarr-apparmor-profile-patch.yml
- path: patches/prowlarr-apparmor-profile-patch.yml
- path: patches/jellyfin-intel-quick-sync-patch.yml # configure Intel Quick Sync on Jellyfin
- path: patches/jellyfin-affinity-rules-patch.yml # configure Jellyfin to run on the mediaserver node
- path: patches/sabnzbd-affinity-rules-patch.yml # configure Sabnzbd to run on the mediaserver node
- path: patches/jellyfin-load-balancer-patch.yml # configure Jellyfin to use a Load Balancer
  target:
    kind: Service
    name: jellyfin
    version: v1
- path: patches/pvc-mediaserver-player-patch.yml
  target:
    group: apps
    kind: Deployment
    name: jellyfin
    version: v1
- path: patches/pvc-mediaserver-movies-patch.yml
  target:
    group: apps
    kind: Deployment
    name: radarr
    version: v1
- path: patches/pvc-mediaserver-tvshows-patch.yml
  target:
    group: apps
    kind: Deployment
    name: sonarr
    version: v1
- path: patches/pvc-mediaserver-downloads-patch.yml
  target:
    group: apps
    kind: Deployment
    name: sabnzbd
    version: v1

configMapGenerator:
- literals:
  - PUID=1001
  - PGID=1002
  name: mediaplatform-env
  options:
    disableNameSuffixHash: true
